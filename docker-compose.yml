  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_URL=http://localhost:8001
        - VITE_APP_URL=http://localhost:8002
        - VITE_PAYMENT_URL=http://localhost:8003
        - VITE_EMAIL_URL=http://localhost:8004
        - VITE_WEBSOCKET_URL=http://localhost:8005
        - VITE_WEBSOCKET=true
        - VITE_CLIENT_BASE_URL=http://localhost:8000
        - VITE_RAZORPAY_KEY_ID=rzp_test_T4QCw0RGAXxiqq
        - VITE_JAUTH_BASE_URL=${VITE_JAUTH_BASE_URL:-http://localhost:8006}
        - VITE_JAUTH_CLIENT_ID=a925084f38b053b4e5f98c0a7a6f404b29f2e2a0d5e76f992db0cca9a5453240
    container_name: nittbooking-client
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - app-service
      - payment-service
      - email-service
      - websocket-service
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
