      - Gmail_pass=acuq kycu iyhe xiyc
      - CLIENT_URL=http://localhost:8000
      - SERVER_URL=http://localhost:8004
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - RABBITMQ_URL=amqp://jbooking-rabbitmq
      - ASYNC_EMAIL=true
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - app-network

  websocket-service:
    build:
      context: ./server/websocket-service
      dockerfile: Dockerfile
    container_name: nittbooking-websocket
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - MONGODB_URL=mongodb+srv://jagadesh:5H8DNdJgxtRgoeot@cluster1.0qd3hua.mongodb.net/NittBooking?retryWrites=true&w=majority&appName=cluster1
